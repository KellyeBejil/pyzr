name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller playwright openpyxl

    - name: Install Playwright Browsers
      shell: bash
      run: |
        # 设置安装路径为当前目录下的 browsers 文件夹
        export PLAYWRIGHT_BROWSERS_PATH=$PWD/browsers
        playwright install chromium
        echo "Installing browsers to $PLAYWRIGHT_BROWSERS_PATH"
        ls -R browsers

    - name: Build EXE
      # Windows use ; for separator
      run: |
        pyinstaller --onefile --windowed --name "TungeeCrawler" --add-data "browsers;browsers" crawler_gui.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TungeeCrawler-Windows
        path: dist/TungeeCrawler.exe
        retention-days: 30
